# ============================================================
# Project metadata
# ============================================================

[project]
name = "webservice-py-tool"
version = "0.1.0"
requires-python = ">=3.14"

# Runtime dependencies
dependencies = [
    "loguru>=0.7.3",
    "lxml==6.1.3",
    "pyside6-essentials>=6.11.2",
    "pyyaml>=6.0.3",
    "suds>=1.2.0",
]

# ============================================================
# CLI commands
# ============================================================

[project.scripts]
ws-tool = "src.ws_tool:main"
test = "tasks.test:main"
lint = "tasks.lint:main"
build = "tasks.build:main"
package = "tasks.package:main"
clean = "tasks.clean:main"
clean-package = "tasks.clean_package:main"

# ============================================================
# Development dependencies
# ============================================================

[dependency-groups]
dev = [
    "numpy==2.5.3",
    "pyinstaller>=6.22.3",
    "pyqtgraph==0.14.0",
    "pyqtinspect>=0.5.0",
    "pytest>=9.1.1",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.4",
]

# ============================================================
# uv
# ============================================================

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
link-mode = "copy"

# ============================================================
# pytest
# ============================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-n auto"

# ============================================================
# Build system
# ============================================================
#
# 使用 Hatchling 作為 Python package 的建置後端。
#
# [build-system]
#   requires:
#     建置專案本身所需要的工具。
#
#   build-backend:
#     指定實際負責建立 wheel / source distribution 的後端。
#
# 目前專案使用 Hatchling，而不是 setuptools。
# uv build / python -m build 等標準 Python 建置工具會依照
# 這裡的設定載入 Hatchling 進行建置。
#
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling 的 wheel 打包內容。
#
# 目前只將 tasks/ 視為需要打包進 wheel 的 Python package。
#
# 注意：
#   [project.scripts] 中的 entry point：
#
#       test = "tasks.test:main"
#       lint = "tasks.lint:main"
#       build = "tasks.build:main"
#
#   都依賴 tasks package 能夠被正確安裝。
#
[tool.hatch.build.targets.wheel]
packages = ["tasks"]


# ============================================================
# Ruff
# ============================================================
#
# Ruff 是本專案的 Python 靜態檢查工具（linter）。
#
# 目前設定採取「保守檢查」策略：
#
#   1. 檢查明顯的 Python 語法／程式問題
#   2. 檢查部分 pycodestyle 程式碼規範
#   3. 不進行自動化的大規模程式碼風格重構
#
# 因此 Ruff 主要負責「找問題」，而不是強制改寫既有程式碼。
#

[tool.ruff]
# 單行最大長度設定為 120 個字元。
#
# 這是專案的程式碼排版基準。
# 若超過 120 字元，Ruff 的 E501 原本會提出警告；
# 但目前在 [tool.ruff.lint] 中明確忽略 E501，
# 因此實際不會因行長而產生 lint error。
#
line-length = 120


[tool.ruff.lint]
#
# 啟用的規則：
#
# E = pycodestyle
#     檢查部分 Python 程式碼格式與基本編碼規範。
#
# F = Pyflakes
#     檢查較明顯的程式問題，例如：
#       - 未使用的 import
#       - 未定義的變數
#       - 重複或無效的 import
#       - 部分可疑的程式結構
#
# 目前只啟用 E + F，避免一次導入大量風格規則，
# 讓既有程式碼可以逐步導入 Ruff。
#
select = ["E", "F"]


# E501 = line too long
#
# 雖然 line-length 設定為 120，
# 但目前不將「超過 120 字元」視為 lint error。
#
# 原因：
#   - 某些 SQL / URL / XML / JSON / 設定字串本身可能較長
#   - 避免為了符合行長而破壞程式可讀性
#
ignore = ["E501"]