[project]
name = "webservice-py-tool"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "lxml==6.1.3",
    "pyside6-essentials>=6.11.2",
    "pyyaml>=6.0.3",
    "suds>=1.2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyqtinspect>=0.5.0",
    "pytest>=9.1.1",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
