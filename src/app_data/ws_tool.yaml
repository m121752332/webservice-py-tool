app:
  # Name of the application
  name: "TIPTOP WebService Tool"
  # Version of the application
  version: "v2.0.6"
  # Description of the application
  copyright: "Copyright 2026 GameStudio. All rights reserved."
  # APP icon location
  img: "assets/app_icon.ico"
  # APP request waiting timeout value (seconds)
  timeout: 120

  # Log path of the application
  log:
    # Run log path setting
    path: "app_data/logs"
    # Run log level（run.log 門檻）
    level: info
    # 額外分流的等級（info, debug, error, other，以逗號分隔；留空則不分流）
    levels: "info, debug, error, other"
    # Run log retention days（run.log 與 ws_*.log）
    retention: "10 days"
    # Request xml log record（ws_xml.log）
    xml:
      # enabled log record
      enabled: true
      # content：params（參數＋回應）/ envelope（SOAP 信封）/ both
      content: params
      # XML log retention days
      retention: 30
  # connection path and profile setting
  connection:
    # connection path
    path: "app_data"
    # connection file name
    profile: "connections.profile"